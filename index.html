<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tharun Motipalli · Data Engineer</title>
    <meta name="description" content="Tharun Motipalli builds lakehouse pipelines, data quality systems and APIs with Python, PySpark, Databricks and AWS." />
    <meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13110f" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Tharun Motipalli · Data Engineer" />
    <meta property="og:description" content="Lakehouse pipelines, data quality and APIs on Databricks and AWS." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- first frame of the hero clip, per layout, so the hero paints straight away -->
    <link rel="preload" as="image" type="image/webp" href="/frames/desktop/f000.webp" media="(min-width: 761px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/frames/mobile/f000.webp" media="(max-width: 760px)" fetchpriority="high" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Tharun Motipalli, Data Engineer. Email: motipallitharun@outlook.com</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
